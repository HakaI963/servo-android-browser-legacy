name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_engine:
        description: 'Build the native Servo engine from source (slow, ~40 min)'
        type: boolean
        default: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      build_engine: ${{ steps.set.outputs.build_engine }}
    steps:
      - id: set
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "build_engine=${{ inputs.build_engine }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "build_engine=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_engine=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: config
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Free disk space for the engine build
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          swap-storage: false

      - name: Checkout browser app
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Checkout Servo engine source
        if: needs.config.outputs.build_engine == 'true'
        uses: actions/checkout@v4
        with:
          repository: servo/servo
          path: servo
          submodules: recursive
          fetch-depth: 1

      - name: Set up Rust
        if: needs.config.outputs.build_engine == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install LLVM and Clang
        if: needs.config.outputs.build_engine == 'true'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"

      - name: Set up Python
        if: needs.config.outputs.build_engine == 'true'
        uses: actions/setup-python@v6
        with:
          python-version-file: servo/.python-version

      - name: Install uv
        if: needs.config.outputs.build_engine == 'true'
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.16"

      - name: Bootstrap Servo build dependencies
        if: needs.config.outputs.build_engine == 'true'
        shell: bash
        run: cd servo && ./mach bootstrap --yes --skip-lints --skip-nextest

      - name: Build libservoshell.so for ARM64
        if: needs.config.outputs.build_engine == 'true'
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          RUST_BACKTRACE: 1
        run: |
          cd servo
          ./mach build --android --target aarch64-linux-android --profile checked-release
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          SO=$(find target/aarch64-linux-android -name libservoshell.so -type f | head -n1)
          if [[ -z "$SO" ]]; then
            echo "::error::libservoshell.so was not produced by the Servo build"
            exit 1
          fi
          cp "$SO" ../app/src/main/jniLibs/arm64-v8a/libservoshell.so
          ls -lh ../app/src/main/jniLibs/arm64-v8a/libservoshell.so

      - name: Assemble release APK
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: servo-browser-arm64-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: servo-browser-arm64-release
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
